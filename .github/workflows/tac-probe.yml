# Research: how is the palawa kani place names map built? Prints a summary to the log; nothing committed.
name: tac-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) lunamap-research"
          B=https://tacinc.com.au/pulingina-to-lutruwita-tasmania-place-names
          curl -sSL -A "$UA" -o index.html "$B/map"
          js=$(grep -oE 'assets/index-[^"]+\.js' index.html | head -1)
          curl -sSL -A "$UA" -o app.js "$B/$js"; ls -la
          echo '=== libs'; grep -oE '(maplibre|mapbox|leaflet|openlayers|ol/|deck\.gl|cesium|protomaps|pmtiles|tailwind|vue|react|svelte)[a-zA-Z.-]{0,20}' app.js | sort | uniq -c | sort -rn | head -30
          echo '=== urls'; grep -oE 'https?://[^"'"'"'`) \\]+' app.js | sort | uniq -c | sort -rn | head -80
          echo '=== paths'; grep -oE '["'"'"'`](\.?/)?[a-zA-Z0-9_/.{}$-]*\.(json|geojson|pmtiles|mp3|m4a|wav|ogg|png|webp|jpg)["'"'"'`]' app.js | sort -u | head -60
          echo '=== api-ish'; grep -oE '["'"'"'`][^"'"'"'`]{0,60}(api|graphql|wp-json|endpoint|supabase|firebase|airtable|sheets)[^"'"'"'`]{0,60}["'"'"'`]' app.js | sort -u | head -40
          echo '=== imports'; grep -oE 'assets/[A-Za-z0-9_.-]+\.(js|json)' app.js | sort -u | head -40
          echo '=== keys'; grep -oE '(name|title|placeName|english|palawa|audio|pronunciation|lat|lng|longitude|latitude|coordinates)[A-Za-z_]{0,12}:' app.js | sort | uniq -c | sort -rn | head -40
          for a in $(grep -oE 'assets/[A-Za-z0-9_.-]+\.(js|json)' app.js | sort -u | head -15); do curl -sSL -A "$UA" -o "$(basename $a)" "$B/$a"; done
          ls -la
          echo '=== urls-in-chunks'; cat *.js *.json 2>/dev/null | grep -oE 'https?://[^"'"'"'`) \\]+' | sort | uniq -c | sort -rn | head -60
          echo '=== sample-feature'; for f in *.json; do echo "-- $f"; head -c 800 "$f"; echo; done 2>/dev/null
          grep -oE '\{[^{}]{0,40}(lat|latitude)[^{}]{0,300}\}' app.js | head -3
