# Research: shape of the palawa kani place names API (counts, field names, CORS). Prints a summary to the log; nothing committed.
name: tac-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) lunamap-research"
          W=https://tacinc.com.au/wp-json
          for u in "$W/wp/v2/location?per_page=100&page=1&acf_format=standard&_fields=id,slug,title,acf" "$W/wp/v2/river?per_page=100&page=1&_fields=id,slug,title,modified,acf&acf_format=standard" "$W/options/all"; do
            echo "== $u"
            curl -sS -A "$UA" -D h.txt -o b.json -H "Origin: https://mdsumner.github.io" "$u"
            grep -iE "^(HTTP|access-control|x-wp-total|x-wp-totalpages|content-type)" h.txt
            python3 - <<'PY'
          import json
          d=json.load(open('b.json'))
          if isinstance(d,list):
              print('items',len(d))
              a=d[0].get('acf',{})
              print('acf keys', {k:type(v).__name__ for k,v in a.items()})
              for k,v in a.items():
                  s=json.dumps(v); print(' ',k, s[:160])
              print('title', d[0].get('title'))
              # coverage of fields across items
              from collections import Counter
              c=Counter(k for x in d for k,v in (x.get('acf') or {}).items() if v not in (None,'',False,[]))
              print('nonempty', dict(c))
          else:
              print('keys', list(d)[:40])
          PY
          done
