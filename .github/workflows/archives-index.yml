# Build the "Archives near here" index (data/archives/) from the Libraries Tasmania
# Digitised Archives catalogue on data.gov.au (CC BY 4.0). Run by hand, and yearly.
name: archives-index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 20 2 *"   # yearly, late February

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Download the catalogue
        run: |
          curl -sS --fail --retry 3 -L -o archives.csv \
            https://data.gov.au/data/dataset/d7ec2d93-b9dd-482b-b6d9-432b2a2455a3/resource/ee8ec788-77ed-4faf-8ceb-17f046ab2a4f/download/archives_ite_dix.csv
      - name: Build the index
        run: python3 scripts/archives_index.py archives.csv
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/archives
          git diff --cached --quiet || git commit -m "Update archives index"
          git push
