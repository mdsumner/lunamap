# Research: probe the Tasmania 2 m DEM COG as contours.js reads it (structure, overview levels, reads).
name: dem-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p probe && cp scripts/dem_probe.mjs probe/ && cd probe && npm init -y >/dev/null && npm install geotiff@3.0.5 proj4@2.12.1 >/dev/null
          node dem_probe.mjs 2>&1 | tee ../research/dem-probe.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add research/dem-probe.txt && git commit -m "Research: DEM probe" && git push || true
