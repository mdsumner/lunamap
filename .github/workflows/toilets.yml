# Public toilets in Tasmania (National Public Toilet Map + OpenStreetMap) for the Toilets layer.
name: toilets
on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 4 * *"   # monthly
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/toilets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/toilets-tas.json
          git diff --cached --quiet || git commit -m "Update toilets for Tasmania"
          git push
