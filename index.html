<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>lunamap</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c62828">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#555; --accent:#c62828; --line:#ddd; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position:absolute; inset:0; }
  .bar { position:absolute; top:10px; left:10px; right:10px; z-index:1000;
    display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
  .bar > * { pointer-events:auto; }
  .bar select { max-width:44vw; }
  .bar select, .bar button { font:inherit; font-size:15px; padding:9px 10px; border:1px solid #999;
    border-radius:8px; background:#fff; color:#111; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #goto { flex:1 1 170px; display:flex; margin:0; }
  #goto input { flex:1; min-width:0; font:inherit; font-size:16px; padding:8px 10px; border:1px solid #999;
    border-radius:8px; background:#fff; color:#111; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #more { display:block; width:100%; margin-top:4px; border:0; background:none; color:#1565c0;
    font:inherit; font-size:13px; text-align:left; padding:4px 0; cursor:pointer; }
  #results { flex:1 1 100%; display:none; max-height:45vh; overflow-y:auto; background:#fff;
    border:1px solid #999; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  #results button { display:block; width:100%; text-align:left; border:0; border-top:1px solid #eee;
    background:#fff; box-shadow:none; border-radius:0; padding:10px 12px; font-size:14px; }
  #results button:first-child { border-top:0; }
  #results button small { color:#777; }
  #results .note { padding:6px 12px; font-size:12px; color:#777; background:#fafafa; }
  .bar button.on { background:#1565c0; color:#fff; border-color:#1565c0; }
  #panel { position:absolute; left:10px; right:10px; bottom:22px; z-index:1000; max-width:460px;
    background:#fff; border:1px solid #999; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.3);
    padding:10px 12px; display:none; max-height:55vh; overflow-y:auto; }
  #panel h2 { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--muted);
    display:flex; justify-content:space-between; align-items:center; }
  #panel h2 button { border:0; background:none; font-size:20px; line-height:1; padding:0 4px; cursor:pointer; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .k { width:92px; flex:none; font-size:12px; color:var(--muted); }
  .row .v { flex:1; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; user-select:all; }
  .row button { flex:none; font-size:12px; padding:4px 8px; border:1px solid #bbb; border-radius:6px;
    background:#f5f5f5; cursor:pointer; }
  .acts { display:flex; gap:6px; margin-top:8px; }
  .acts button { flex:1; font:inherit; font-size:14px; padding:8px; border:1px solid #999;
    border-radius:8px; background:#f5f5f5; cursor:pointer; }
  #tools { display:contents; }
  .bar.collapsed #tools { display:none; }
  .sheet { position:absolute; left:10px; right:10px; bottom:22px; z-index:1001; max-width:460px; display:none;
    background:#fff; border:1px solid #999; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.3);
    padding:10px 12px; max-height:70vh; overflow-y:auto; }
  .sheet h2 { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--muted);
    display:flex; justify-content:space-between; align-items:center; }
  .sheet h2 button { border:0; background:none; font-size:20px; line-height:1; padding:0 4px; cursor:pointer; }
  .sheet .small, .sheet label { font-size:13px; color:#333; }
  .sheet p { margin:0 0 8px; }
  #offbases label { display:inline-block; margin:2px 10px 2px 0; }
  #offest, #offprog, #offstat { margin-top:6px; }
  #toast { position:absolute; left:50%; top:60px; transform:translateX(-50%); z-index:1100;
    background:#222; color:#fff; padding:6px 12px; border-radius:6px; font-size:13px; display:none; }
  #glabels { position:absolute; inset:0; z-index:650; pointer-events:none; overflow:hidden; }
  .glab { position:absolute; font:700 14px/1 ui-monospace, Menlo, Consolas, monospace; color:#0d47a1;
    white-space:nowrap; text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .glab small { font-size:10px; font-weight:400; }
  .glab.t { transform:translate(-50%, 0); }
  .glab.b { transform:translate(-50%, -100%); }
  .glab.l { transform:translate(0, -50%); }
  .glab.r { transform:translate(-100%, -50%); }
  .on-ortho .plab { color:#fff; text-shadow:0 0 2px #000, 0 0 3px #000, 0 0 4px rgba(0,0,0,.8); }
  .plab { font:600 11px/1.1 system-ui, sans-serif; color:#4a2c00; white-space:nowrap; text-align:center;
    text-shadow:0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; transform:translate(-50%, -50%); pointer-events:none; }
  .wsym { display:flex; align-items:center; justify-content:center; font:700 10px/1 system-ui, sans-serif;
    color:#fff; border:1.5px solid #fff; box-shadow:0 0 2px rgba(0,0,0,.7); box-sizing:border-box; }
  .wsym.hyd { background:#1565c0; border-radius:50%; }
  .wsym.tw { background:#0d3c73; border-radius:3px; }
  .wsym.ti { background:#00796b; border-radius:3px; }
  .wsym.gate { background:#fdd835; color:#000; border-color:#000; border-radius:2px; transform:rotate(45deg); }
  .wsym.gate > * { transform:rotate(-45deg); }
  #printhead { display:none; }
  @media print {
    @page { margin:8mm; }
    .bar, #toast, .leaflet-control-zoom, #panel .acts, #panel h2 button, .row button, #more, .sheet { display:none !important; }
    #printhead { display:block; position:absolute; top:0; left:0; right:0; z-index:1000;
      background:#fff; padding:4px 8px; font-size:12px; border-bottom:1px solid #000; }
    #panel { box-shadow:none; border:1px solid #000; bottom:8px; }
    .leaflet-control-attribution { font-size:9px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <select id="layer" aria-label="Basemap"></select>
  <button id="locate" title="Show my location">Locate</button>
  <button id="pinme" title="Drop a pin at my location">Pin me</button>
  <button id="moretools" title="Show or hide layer and tool buttons">More</button>
  <span id="tools">
  <button id="grid" title="MGA grid with edge labels">Grid</button>
  <button id="parcels" title="Cadastral parcels and addresses (zoom in)">Parcels</button>
  <button id="water" title="Hydrants, dams, reservoirs, tanks and pump stations">Water</button>
  <button id="gates" title="Gates and barriers (zoom in)">Gates</button>
  <button id="offline" title="Save maps for use without signal">Offline</button>
  <button id="print" title="Print or save this view as PDF">Print</button>
  <button id="help" title="How to use this map" onclick="location.href='help.html'">Help</button>
  </span>
  <form id="goto" autocomplete="off">
    <input id="q" type="search" enterkeyhint="go" placeholder="Go to: address, grid ref, lon lat, MGA..."
      aria-label="Go to an address, grid reference or coordinate">
  </form>
  <div id="results" role="listbox"></div>
</div>

<div id="printhead"></div>

<div id="panel">
  <h2><span>Pinned location</span><button id="close" aria-label="Close">x</button></h2>
  <div id="rows"></div>
  <div class="acts">
    <button id="share">Share link</button>
    <button id="copyall">Copy all</button>
  </div>
</div>

<div id="offsheet" class="sheet">
  <h2><span>Offline maps</span><button id="offclose" aria-label="Close">x</button></h2>
  <p class="small">Saves map tiles for the area in view, so the map, GPS dot, grid and coordinates
    work without signal. Addresses, parcels, water and gates need signal, except where you have
    already looked at them while online.</p>
  <div id="offbases"></div>
  <label class="small">Detail down to zoom
    <select id="offz"><option>15</option><option>16</option><option selected>17</option><option>18</option></select>
  </label>
  <div id="offest" class="small"></div>
  <div class="acts"><button id="offsave">Save this area</button><button id="offclear">Clear saved</button></div>
  <div id="offprog" class="small"></div>
  <div id="offstat" class="small"></div>
</div>

<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Basemaps: theLIST ArcGIS tile caches (Web Mercator, standard XYZ 256px)
// ---------------------------------------------------------------------------
var LIST = "https://services.thelist.tas.gov.au/arcgis/rest/services/Basemaps/";
var CC_BY = "CC BY 3.0 AU";
var CC_NC = "CC BY-NC-ND 3.0 AU";
var BASEMAPS = [
  { id: "topo",   name: "Topographic",              svc: "Topographic",          max: 18, lic: CC_BY },
  { id: "esmb",   name: "Emergency Services 1:50k", svc: "ESgisMapBookPUBLIC",   max: 15, lic: "" },
  { id: "tasmap", name: "TASMAP raster",            svc: "TasmapRaster",         max: 16, lic: CC_NC },
  { id: "ortho",  name: "Aerial photo",             svc: "Orthophoto",           max: 19, lic: CC_NC },
  { id: "hill",   name: "Hillshade",                svc: "Hillshade",            max: 18, lic: CC_BY },
  { id: "grey",   name: "Topographic (grey)",       svc: "TopographicGrayScale", max: 18, lic: CC_BY }
];

// ---------------------------------------------------------------------------
// Projections. GDA2020 is treated as equal to WGS84/GPS (sub-metre, fine for this).
// MGA94 uses the ICSM 7-parameter GDA2020->GDA94 transformation (agrees with
// PROJ to ~0.15 m; the full NTv2 distortion grid is not applied).
// ---------------------------------------------------------------------------
function mgaDefs(zone) {
  return {
    mga2020: "+proj=utm +zone=" + zone + " +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs",
    mga94:   "+proj=utm +zone=" + zone + " +south +ellps=GRS80 " +
             "+towgs84=-0.06155,0.01087,0.04019,0.0394924,0.0327221,0.0328979,0.009994 +units=m +no_defs"
  };
}
var DEG = "\u00b0";

function pad(n, w) { var s = String(n); while (s.length < w) s = "0" + s; return s; }

function fmtDMS(v, pos, neg) {
  var h = v < 0 ? neg : pos; v = Math.abs(v);
  var d = Math.floor(v), mf = (v - d) * 60, m = Math.floor(mf), s = (mf - m) * 60;
  if (s >= 59.95) { s = 0; m += 1; } if (m >= 60) { m = 0; d += 1; }
  return d + DEG + " " + pad(m, 2) + "' " + (s < 10 ? "0" : "") + s.toFixed(1) + "\" " + h;
}
function fmtDDM(v, pos, neg) {
  var h = v < 0 ? neg : pos; v = Math.abs(v);
  var d = Math.floor(v), m = (v - d) * 60;
  if (m >= 59.9995) { m = 0; d += 1; }
  return d + DEG + " " + (m < 10 ? "0" : "") + m.toFixed(3) + "' " + h;
}

function coords(lat, lon) {
  var zone = Math.floor((lon + 180) / 6) + 1;
  var d = mgaDefs(zone);
  var g20 = proj4("EPSG:4326", d.mga2020, [lon, lat]);
  var g94 = proj4("EPSG:4326", d.mga94, [lon, lat]);
  // 6-figure grid reference: 100 m digits of easting and northing (MGA2020)
  var gr = pad(Math.floor(g20[0] / 100) % 1000, 3) + " " + pad(Math.floor(g20[1] / 100) % 1000, 3);
  return [
    { k: "Lon, Lat",   v: lon.toFixed(6) + ", " + lat.toFixed(6) },
    { k: "Lat, Lon",   v: lat.toFixed(6) + ", " + lon.toFixed(6) },
    { k: "MGA94 z" + zone,   v: Math.round(g94[0]) + " E  " + Math.round(g94[1]) + " N" },
    { k: "Grid ref",   v: gr },
    { k: "MGA2020 z" + zone, v: Math.round(g20[0]) + " E  " + Math.round(g20[1]) + " N", extra: true },
    { k: "DMS",        v: fmtDMS(lat, "N", "S") + "  " + fmtDMS(lon, "E", "W"), extra: true },
    { k: "Deg min",    v: fmtDDM(lat, "N", "S") + "  " + fmtDDM(lon, "E", "W"), extra: true }
  ];
}

// ---------------------------------------------------------------------------
// State in the URL hash: #z/lat/lon/layer[/pinlat/pinlon]
// ---------------------------------------------------------------------------
function readHash() {
  var p = location.hash.replace(/^#/, "").split("/");
  var o = {};
  if (p.length >= 3 && !isNaN(+p[0])) { o.z = +p[0]; o.lat = +p[1]; o.lon = +p[2]; }
  if (p[3]) { var t = p[3].split(","); o.layer = t[0]; o.grid = t.indexOf("g") > 0; o.noParcels = t.indexOf("np") > 0; o.water = t.indexOf("w") > 0; o.gates = t.indexOf("b") > 0; }
  if (p.length >= 6) { o.pin = [+p[4], +p[5]]; }
  return o;
}

var st = readHash();
// Home view: 1.5 km either side of Fern Tree fire station (7 Summerleas Rd)
var HOME = { lat: -42.923231, lon: 147.260121, halfWidthM: 1500 };
function homeBounds() {
  var dLat = HOME.halfWidthM / 111320, dLon = HOME.halfWidthM / (111320 * Math.cos(HOME.lat * Math.PI / 180));
  return L.latLngBounds([HOME.lat - dLat, HOME.lon - dLon], [HOME.lat + dLat, HOME.lon + dLon]);
}
var map = L.map("map", { zoomControl: true, attributionControl: true, maxZoom: 19, minZoom: 6, zoomSnap: 0.25 });
// fit the home area exactly (fractional zoom), then go back to whole zoom steps
if (st.z !== undefined) map.setView([st.lat, st.lon], st.z); else map.fitBounds(homeBounds());
map.options.zoomSnap = 1;
L.control.scale({ imperial: false, position: "bottomright" }).addTo(map);

var layers = {}, current = null;
var sel = document.getElementById("layer");
BASEMAPS.forEach(function (b) {
  layers[b.id] = L.tileLayer(LIST + b.svc + "/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom: b.max, maxZoom: 19,
    attribution: "&copy; State of Tasmania, <a href=\"https://www.thelist.tas.gov.au\">theLIST</a>" +
      (b.lic ? " (" + b.lic + ")" : "")
  });
  var o = document.createElement("option"); o.value = b.id; o.textContent = b.name; sel.appendChild(o);
});
function setLayer(id) {
  if (!layers[id]) id = "topo";
  if (current) map.removeLayer(current);
  current = layers[id].addTo(map); sel.value = id;
  if (typeof syncParcelOverlay === "function" && parcelTiles) syncParcelOverlay();
  writeHash();
}
sel.addEventListener("change", function () { setLayer(sel.value); });

var pin = null;
function writeHash() {
  var c = map.getCenter();
  var h = "#" + map.getZoom() + "/" + c.lat.toFixed(5) + "/" + c.lng.toFixed(5) + "/" +
    (sel.value || "topo") + (gridOn ? ",g" : "") + (parcelsOn ? "" : ",np") +
    (OVERLAYS && OVERLAYS.water && OVERLAYS.water.on ? ",w" : "") + (OVERLAYS && OVERLAYS.gates && OVERLAYS.gates.on ? ",b" : "");
  if (pin) { var p = pin.getLatLng(); h += "/" + p.lat.toFixed(6) + "/" + p.lng.toFixed(6); }
  history.replaceState(null, "", h);
}
map.on("moveend", writeHash);

// ---------------------------------------------------------------------------
// Pin + coordinate panel
// ---------------------------------------------------------------------------
var panel = document.getElementById("panel"), rowsEl = document.getElementById("rows");
var lastRows = [], showMore = false;
var pinIcon = L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
  html: "<svg width='22' height='22' viewBox='0 0 22 22'><circle cx='11' cy='11' r='8' fill='none' " +
        "stroke='#c62828' stroke-width='3'/><circle cx='11' cy='11' r='2' fill='#c62828'/></svg>" });

function setPin(latlng) {
  if (!pin) pin = L.marker(latlng, { icon: pinIcon, draggable: true }).addTo(map)
    .on("drag", function () { showCoords(pin.getLatLng()); })
    .on("dragend", function () { writeHash(); lookupParcel(pin.getLatLng()); lookupMapbook(pin.getLatLng()); });
  else pin.setLatLng(latlng);
  parcelInfo = null; featureInfo = null; showCoords(latlng); writeHash();
  lookupParcel(latlng); lookupMapbook(latlng);
}
function showCoords(ll) {
  var cr = coords(ll.lat, ll.lng), gi = 4;
  lastRows = featureRows().concat(parcelRows(), cr.slice(0, gi), mapbookRows(), cr.slice(gi));
  rowsEl.innerHTML = "";
  lastRows.forEach(function (r) {
    if (r.extra && !showMore) return;
    var d = document.createElement("div"); d.className = "row";
    d.innerHTML = "<span class='k'></span><span class='v'></span><button>Copy</button>";
    d.querySelector(".k").textContent = r.k;
    d.querySelector(".v").textContent = r.v;
    d.querySelector("button").onclick = function () { copy(r.v); };
    rowsEl.appendChild(d);
  });
  var m = document.createElement("button"); m.id = "more";
  m.textContent = showMore ? "Fewer formats" : "More formats (MGA2020, DMS, deg min)";
  m.onclick = function () { showMore = !showMore; showCoords(ll); };
  rowsEl.appendChild(m);
  panel.style.display = "block";
  if (typeof placeLabels === "function") placeLabels();
}
var lastFeatureClick = 0;
map.on("click", function (e) { if (Date.now() - lastFeatureClick < 300) return; setPin(e.latlng); });
document.getElementById("close").onclick = function () {
  panel.style.display = "none"; if (pin) { map.removeLayer(pin); pin = null; }
  parcelInfo = null; parcelHi.clearLayers(); writeHash(); placeLabels();
};

function toast(msg) {
  var t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
  t.style.top = (document.querySelector(".bar").getBoundingClientRect().bottom + 8) + "px";
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 2500);
}
function copy(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Copy failed"); }
    document.body.removeChild(ta);
  }
}
function allText() {
  return lastRows.filter(function (r) { return showMore || !r.extra; }).map(function (r) { return r.k + ": " + r.v; }).join("\n") + "\n" + location.href;
}
document.getElementById("copyall").onclick = function () { copy(allText()); };
document.getElementById("share").onclick = function () {
  if (navigator.share) navigator.share({ title: "Location", text: allText(), url: location.href }).catch(function () {});
  else copy(allText());
};

// ---------------------------------------------------------------------------
// GPS
// ---------------------------------------------------------------------------
var me = null, meAcc = null, watchId = null, lastFix = null, follow = false;
var locBtn = document.getElementById("locate");
function onFix(p) {
  var ll = L.latLng(p.coords.latitude, p.coords.longitude); lastFix = ll;
  if (!me) {
    meAcc = L.circle(ll, { radius: p.coords.accuracy, color: "#1565c0", weight: 1, fillOpacity: 0.12 }).addTo(map);
    me = L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: "#1565c0", fillOpacity: 1 }).addTo(map);
  } else { me.setLatLng(ll); meAcc.setLatLng(ll).setRadius(p.coords.accuracy); }
  if (follow) { map.setView(ll, Math.max(map.getZoom(), 15)); follow = false; }
  if (pendingPin) { pendingPin = false; setPin(ll); }
}
function onErr(e) { toast("Location unavailable: " + e.message); stopWatch(); }
function startWatch() {
  if (!navigator.geolocation) { toast("No geolocation in this browser"); return; }
  watchId = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 5000 });
  locBtn.classList.add("on");
}
function stopWatch() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; locBtn.classList.remove("on");
  if (me) { map.removeLayer(me); map.removeLayer(meAcc); me = meAcc = null; }
}
locBtn.onclick = function () {
  if (watchId === null) { follow = true; startWatch(); } else stopWatch();
};
var pendingPin = false;
document.getElementById("pinme").onclick = function () {
  if (lastFix && watchId !== null) { setPin(lastFix); map.setView(lastFix, Math.max(map.getZoom(), 15)); }
  else { pendingPin = true; follow = true; if (watchId === null) startWatch(); }
};

// ---------------------------------------------------------------------------
// Print: browser print / save as PDF of the current view
// ---------------------------------------------------------------------------
document.getElementById("print").onclick = function () {
  var b = BASEMAPS.filter(function (x) { return x.id === sel.value; })[0];
  var bb = map.getBounds();
  document.getElementById("printhead").textContent =
    b.name + "  |  " + new Date().toLocaleString("en-AU") + "  |  view " +
    bb.getSouth().toFixed(4) + "," + bb.getWest().toFixed(4) + " to " +
    bb.getNorth().toFixed(4) + "," + bb.getEast().toFixed(4) + "  |  " + location.href;
  setTimeout(function () { window.print(); }, 50);
};

// ---------------------------------------------------------------------------
// Go to: parse whatever was typed or pasted.
//   grid ref   "265522", "265 522", 4/8/10 figures too (MGA2020, nearest to the view)
//   lon, lat   "147.3257, -42.8821" (default order when it cannot be told apart)
//   lat, lon   "-42.8821 147.3257" (recognised by magnitude, or a "Lat, Lon:" label)
//   MGA        "526598 E 5252225 N" or "526598 5252225" (MGA94 unless labelled MGA2020)
//   DMS / DDM  "42 52 55.6 S 147 19 32.5 E", "S42 52.926 E147 19.542"
// Lines copied from the panel ("MGA94 z55: ...", "Grid ref: ...") work as-is.
// ---------------------------------------------------------------------------
function parseLocation(raw) {
  var line = String(raw).split(/\r?\n/).filter(function (x) { return x.trim(); })[0] || "";
  var hint = "", m = line.match(/^\s*([A-Za-z][^:]*):(.*)$/);
  if (m) { hint = m[1].toLowerCase(); line = m[2]; }
  if (/[A-Za-z]{2,}/.test(line)) return null;           // words: an address, not a coordinate
  var datum = /2020/.test(hint) ? "mga2020" : "mga94";
  var zoneHint = (hint.match(/z\s*(\d{2})/) || [])[1];
  var s = line.replace(/[\u00b0\u00ba\u02da\u2032\u2033'"`:]/g, " ").replace(/[\u2212\u2013]/g, "-").toUpperCase();
  var toks = s.match(/-?\d+(?:\.\d+)?|[NSEW]/g) || [];
  var nums = toks.filter(function (t) { return !/[NSEW]/.test(t); }).map(Number);
  var hasLetters = toks.some(function (t) { return /[NSEW]/.test(t); });
  var c = map.getCenter(), zone = +zoneHint || (Math.floor((c.lng + 180) / 6) + 1), defs = mgaDefs(zone);

  function ll(lat, lon, kind) {
    if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180) || isNaN(lat) || isNaN(lon)) return null;
    return { latlng: L.latLng(lat, lon), kind: kind };
  }
  function fromMGA(e, n, def, kind) { var g = proj4(def, "EPSG:4326", [e, n]); return ll(g[1], g[0], kind); }

  // grid reference: digits only, even count 4..10
  var digits = s.replace(/\s+/g, "");
  if (/^[\d\s]+$/.test(s.trim()) && /^\d+$/.test(digits) && digits.length % 2 === 0 &&
      digits.length >= 4 && digits.length <= 10 && (nums.length === 1 ||
      (nums.length === 2 && s.trim().split(/\s+/)[0].length === digits.length / 2)) || /grid/.test(hint)) {
    if (/^\d+$/.test(digits) && digits.length % 2 === 0) {
      var h = digits.length / 2, unit = Math.pow(10, 5 - h);
      var er = +digits.slice(0, h) * unit, nr = +digits.slice(h) * unit;
      var cm = proj4("EPSG:4326", defs.mga2020, [c.lng, c.lat]);
      function near(r, cv) {           // candidate in the 100 km square closest to the view centre
        var best = null;
        for (var k = Math.floor(cv / 1e5) - 1; k <= Math.floor(cv / 1e5) + 1; k++) {
          var v = k * 1e5 + r + unit / 2;
          if (best === null || Math.abs(v - cv) < Math.abs(best - cv)) best = v;
        }
        return best;
      }
      return fromMGA(near(er, cm[0]), near(nr, cm[1]), defs.mga2020,
        "Grid ref " + digits.slice(0, h) + " " + digits.slice(h) + " (MGA2020 z" + zone + ", centre of " + unit + " m square)");
    }
  }

  // MGA easting/northing: big numbers
  var big = nums.filter(function (v) { return Math.abs(v) >= 1000; });
  if (big.length >= 2) {
    var e = big[0], n = big[1];
    if (e > n) { var t = e; e = n; n = t; }           // northing is the 7-digit one
    return fromMGA(e, n, defs[datum], (datum === "mga2020" ? "MGA2020" : "MGA94") + " z" + zone);
  }

  // angular groups
  var groups = [];
  if (hasLetters) {
    var prefix = /[NSEW]/.test(toks[0]), cur = { n: [], h: null };
    toks.forEach(function (t) {
      if (/[NSEW]/.test(t)) {
        if (prefix) { if (cur.n.length || cur.h) groups.push(cur); cur = { n: [], h: t }; }
        else { cur.h = t; groups.push(cur); cur = { n: [], h: null }; }
      } else cur.n.push(+t);
    });
    if (cur.n.length) groups.push(cur);
  } else {
    var parts = line.split(/[,;]/).filter(function (x) { return x.trim(); });
    if (parts.length === 2) {
      parts.forEach(function (p) {
        var q = (p.replace(/[\u00b0\u00ba\u02da\u2032\u2033'"`:]/g, " ").match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
        groups.push({ n: q, h: null, neg: /-/.test(p) });
      });
    } else if (nums.length === 2) groups = [{ n: [nums[0]] }, { n: [nums[1]] }];
    else if (nums.length === 4) groups = [{ n: nums.slice(0, 2) }, { n: nums.slice(2) }];
    else if (nums.length === 6) groups = [{ n: nums.slice(0, 3) }, { n: nums.slice(3) }];
  }
  if (groups.length !== 2) return null;
  var vals = groups.map(function (g) {
    var d = g.n[0], neg = d < 0 || g.neg || g.h === "S" || g.h === "W";
    var v = Math.abs(d) + (g.n[1] || 0) / 60 + (g.n[2] || 0) / 3600;
    return neg ? -v : v;
  });
  var latFirst;
  if (groups[0].h || groups[1].h) latFirst = groups[0].h === "N" || groups[0].h === "S" ||
                                             groups[1].h === "E" || groups[1].h === "W";
  else if (/lat\s*,\s*lon/.test(hint)) latFirst = true;
  else if (/lon\s*,\s*lat/.test(hint)) latFirst = false;
  else if (Math.abs(vals[0]) > 90) latFirst = false;
  else if (Math.abs(vals[1]) > 90) latFirst = true;
  else latFirst = false;                                // default: lon, lat
  return latFirst ? ll(vals[0], vals[1], "Lat, Lon") : ll(vals[1], vals[0], "Lon, Lat");
}

// ---------------------------------------------------------------------------
// Address search against theLIST SearchService "Address Geocodes" (layer 7).
// Only the start of the street name is required:
//   "pillinger"  "12 pillinger"  "12 Pillinger Drive, Fern Tree"  "3/12 pillinger dr 7054"
// Number ranges ("10-14") match any number inside them; street type is optional
// and matched loosely (Road = Rd); suburb is matched by its start.
// Nearest to the current view first; one match jumps, several give a pick list.
// ---------------------------------------------------------------------------
var GEOCODE = "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/SearchService/MapServer/7/query";
var STREET_TYPES = {
  ROAD: "RD", RD: "RD", STREET: "ST", ST: "ST", AVENUE: "AVE", AVE: "AVE", AV: "AVE",
  DRIVE: "DR", DR: "DR", CRESCENT: "CRES", CRES: "CRES", CR: "CRES", COURT: "CT", CT: "CT",
  PLACE: "PL", PL: "PL", LANE: "LANE", LN: "LANE", HIGHWAY: "HWY", HWY: "HWY", PARADE: "PDE", PDE: "PDE",
  TERRACE: "TCE", TCE: "TCE", CLOSE: "CL", CL: "CL", GROVE: "GR", GR: "GR", WAY: "WAY", TRACK: "TRK",
  TRK: "TRK", BOULEVARD: "BVD", BVD: "BVD", BLVD: "BVD", CIRCUIT: "CCT", CCT: "CCT", ESPLANADE: "ESP",
  ESP: "ESP", RISE: "RISE", VIEW: "VIEW", WALK: "WALK", SQUARE: "SQ", SQ: "SQ", HILL: "HILL", GLADE: "GLDE",
  PATH: "PATH", RIDGE: "RDGE", RDGE: "RDGE", MEWS: "MEWS", ROW: "ROW", GARDENS: "GDNS", GDNS: "GDNS"
};
function normType(t) { t = String(t || "").toUpperCase().replace(/\./g, ""); return STREET_TYPES[t] || t; }
function sqlq(v) { return "'" + String(v).replace(/'/g, "''") + "'"; }

function parseAddress(raw) {
  var line = String(raw).split(/\r?\n/)[0].replace(/^\s*address\s*:/i, "");
  var s = line.toUpperCase().replace(/[^A-Z0-9'\/\- ]+/g, " ").replace(/\s+/g, " ").trim();
  var a = { unit: null, num: null };
  var m = /^([0-9]+[A-Z]?)\s*\/\s*([0-9]+)[A-Z]?(?:\s*-\s*[0-9]+[A-Z]?)?\s+(.*)$/.exec(s) ||
          /^()([0-9]+)[A-Z]?(?:\s*-\s*[0-9]+[A-Z]?)?\s+(.*)$/.exec(s);
  if (m) { a.unit = m[1] || null; a.num = +m[2]; s = m[3]; }
  var words = s.split(" ").filter(function (w) { return w && w !== "TAS" && w !== "TASMANIA"; });
  var pc = words.length && /^7[0-9]{3}$/.test(words[words.length - 1]) ? +words.pop() : null;
  a.postcode = pc;
  // split street / locality at a street-type word if there is one
  // every type word after the first word is a candidate split, earliest first
  // ("MAIN RD NEW NORFOLK", and "MOUNT VIEW CRES" where VIEW is also a type)
  a.splits = [];
  for (var i = 1; i < words.length; i++) if (STREET_TYPES[words[i]])
    a.splits.push({ street: words.slice(0, i).join(" "), type: normType(words[i]), loc: words.slice(i + 1).join(" ") });
  for (var k = words.length; k >= 1; k--)            // no type word: longest street first
    a.splits.push({ street: words.slice(0, k).join(" "), type: null, loc: words.slice(k).join(" ") });
  return words.length ? a : null;
}

function geocodeQuery(where) {
  var url = GEOCODE + "?where=" + encodeURIComponent(where) +
    "&outFields=ADDRESS,UNIT_NUMBER,STREET_NUMBER_FROM,STREET_NUMBER_TO,STREET,STREET_TYPE,LOCALITY,POSTCODE" +
    "&returnGeometry=true&outSR=4326&f=json";
  return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) throw new Error(j.error.message || "query failed");
    return (j.features || []).filter(function (f) { return f.geometry; });
  });
}

function addressSearch(raw) {
  var a = parseAddress(raw);
  if (!a) return Promise.resolve(null);
  var c = map.getCenter();
  function where(sp, withNum) {
    var w = ["UPPER(STREET) LIKE " + sqlq(sp.street + "%")];
    if (sp.loc) w.push("UPPER(LOCALITY) LIKE " + sqlq(sp.loc + "%"));
    if (a.postcode) w.push("POSTCODE = " + a.postcode);
    if (withNum && a.num !== null)
      w.push("(STREET_NUMBER_FROM = " + a.num + " OR (STREET_NUMBER_FROM <= " + a.num +
             " AND STREET_NUMBER_TO >= " + a.num + "))");
    return w.join(" AND ");
  }
  function finish(feats, sp, numMatched) {
    if (sp.type) {                                    // loose street-type filter, dropped if it empties
      var t = feats.filter(function (f) { return normType(f.attributes.STREET_TYPE) === sp.type; });
      if (t.length) feats = t;
    }
    if (numMatched && a.unit) {
      var u = feats.filter(function (f) { return String(f.attributes.UNIT_NUMBER || "").toUpperCase() === a.unit; });
      if (u.length) feats = u;
    }
    var items;
    if (numMatched) {
      items = feats.map(function (f) { return { label: f.attributes.ADDRESS, lat: f.geometry.y, lon: f.geometry.x }; });
    } else {                                          // street only: one entry per street + locality
      var g = {};
      feats.forEach(function (f) {
        var at = f.attributes, key = [at.STREET, at.STREET_TYPE, at.LOCALITY].join("|");
        (g[key] = g[key] || { at: at, pts: [] }).pts.push(f.geometry);
      });
      items = Object.keys(g).map(function (k) {
        var e = g[k], p = e.pts.slice().sort(function (x, y) { return x.y - y.y; })[Math.floor(e.pts.length / 2)];
        return { label: [e.at.STREET, e.at.STREET_TYPE].filter(Boolean).join(" ") + ", " + e.at.LOCALITY,
                 sub: e.pts.length + (e.pts.length === 1 ? " address" : " addresses"), lat: p.y, lon: p.x };
      });
    }
    items.forEach(function (it) { it.d = map.distance(c, L.latLng(it.lat, it.lon)); });
    items.sort(function (x, y) { return x.d - y.d; });
    return { items: items, numMatched: numMatched, wanted: a.num };
  }
  // try each street/locality split: with the number, then without it
  var i = 0;
  function next() {
    if (i >= a.splits.length) return Promise.resolve({ items: [] });
    var sp = a.splits[i++];
    var p = a.num !== null ? geocodeQuery(where(sp, true)) : Promise.resolve([]);
    return p.then(function (fs) {
      if (fs.length) return finish(fs, sp, true);
      return geocodeQuery(where(sp, false)).then(function (fs2) {
        return fs2.length ? finish(fs2, sp, false) : next();
      });
    });
  }
  return next();
}

var resultsEl = document.getElementById("results");
function hideResults() { resultsEl.style.display = "none"; resultsEl.innerHTML = ""; fitControls(); }
function goTo(latlng, msg, zoom) {
  hideResults(); document.getElementById("q").blur();
  map.setView(latlng, Math.max(map.getZoom(), zoom || 17));
  setPin(latlng); if (msg) toast(msg);
}
function showResults(res) {
  resultsEl.innerHTML = "";
  if (res.wanted !== null && res.wanted !== undefined && !res.numMatched) {
    var n = document.createElement("div"); n.className = "note";
    n.textContent = "No number " + res.wanted + " found - showing streets"; resultsEl.appendChild(n);
  }
  res.items.slice(0, 12).forEach(function (it) {
    var b = document.createElement("button"); b.type = "button";
    b.textContent = it.label;
    var sm = document.createElement("small");
    sm.textContent = "  " + (it.sub ? it.sub + ", " : "") + (it.d < 1000 ? Math.round(it.d) + " m" : (it.d / 1000).toFixed(it.d < 1e4 ? 1 : 0) + " km") + " away";
    b.appendChild(sm);
    b.onclick = function () { goTo(L.latLng(it.lat, it.lon), null); };
    resultsEl.appendChild(b);
  });
  resultsEl.style.display = "block"; fitControls();
}

document.getElementById("goto").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var q = document.getElementById("q"), r = null;
  var mb = parseMapbook(q.value);
  if (mb) {
    var bname = BOOKS[mb.book].name;
    findMapbook(mb).then(function (ft) {
      if (!ft) { toast("No " + bname.toLowerCase() + (mb.page ? " page " : " square ") + fmtMapref(mb.refs[0])); return; }
      var gj = L.geoJSON(ft), bb = gj.getBounds();
      if (mb.page) { hideResults(); q.blur(); map.fitBounds(bb); toast(bname + " page " + fmtMapref(ft.properties.MAPREF)); }
      else { goTo(bb.getCenter(), bname + " " + fmtMapref(ft.properties.MAPREF) + " (centre of square)", 16); }
      mbOutline.clearLayers(); mbOutline.addLayer(L.geoJSON(ft, { interactive: false,
        style: { color: "#6a1b9a", weight: 2, dashArray: "6 4", fill: false } }));
    }).catch(function (e) { toast(bname + " search failed: " + e.message); });
    return;
  }
  try { r = parseLocation(q.value); } catch (e) { r = null; }
  if (r) { goTo(r.latlng, r.kind, 15); return; }
  if (!/[A-Za-z]{2,}/.test(q.value)) { toast("Could not read that location"); return; }
  toast("Searching addresses...");
  addressSearch(q.value).then(function (res) {
    if (!res || !res.items.length) { toast("No address found"); return; }
    var one = res.items.length === 1 && (res.numMatched || res.wanted === null);
    if (one) { var it = res.items[0]; goTo(L.latLng(it.lat, it.lon), it.label, res.numMatched ? 17 : 16); return; }
    document.getElementById("toast").style.display = "none";
    showResults(res);
  }).catch(function (e) { toast("Address search failed: " + e.message); });
});
document.getElementById("q").addEventListener("input", function () { if (!this.value) hideResults(); });
map.on("click", hideResults);

// ---------------------------------------------------------------------------
// MGA2020 grid, labelled where each line meets the edge of the current view
// (the view is the "margin"). Labels follow the printed-map style: small
// leading digits, bold 2-digit km value, so a 6-figure grid ref reads straight off.
// ---------------------------------------------------------------------------
var gridOn = false, gridLines = [], gridLayer = L.layerGroup().addTo(map);
var glabels = document.createElement("div"); glabels.id = "glabels";
map.getContainer().appendChild(glabels);
var gridBtn = document.getElementById("grid");

function gridLabel(v) {
  var km = Math.round(v / 1000);
  var pre = Math.floor(km / 100), main = pad(km % 100, 2);
  return (pre ? "<small>" + pre + "</small>" : "") + main;
}

function buildGrid() {
  gridLayer.clearLayers(); gridLines = [];
  if (!gridOn) { glabels.innerHTML = ""; return; }
  var c = map.getCenter();
  var zone = Math.floor((c.lng + 180) / 6) + 1;
  var def = mgaDefs(zone).mga2020;
  var b = map.getBounds().pad(0.5), sz = map.getSize();
  // MGA extent of the (padded) view from a ring of edge samples
  var minE = Infinity, maxE = -Infinity, minN = Infinity, maxN = -Infinity;
  for (var i = 0; i <= 8; i++) {
    var f = i / 8, lat = b.getSouth() + f * (b.getNorth() - b.getSouth()),
        lon = b.getWest() + f * (b.getEast() - b.getWest());
    [[b.getWest(), lat], [b.getEast(), lat], [lon, b.getSouth()], [lon, b.getNorth()]].forEach(function (q) {
      var m = proj4("EPSG:4326", def, q);
      minE = Math.min(minE, m[0]); maxE = Math.max(maxE, m[0]);
      minN = Math.min(minN, m[1]); maxN = Math.max(maxN, m[1]);
    });
  }
  // spacing: 1 km unless lines would be closer than ~45 px
  var mpp = (maxE - minE) / (sz.x * 2), s = null;
  [1000, 10000, 100000].some(function (x) { if (x / mpp >= 45) { s = x; return true; } return false; });
  if (!s) { glabels.innerHTML = ""; return; }
  var style = { color: "#0d47a1", weight: s === 1000 ? 1 : 1.5, opacity: 0.75, interactive: false };
  function line(kind, v) {
    var ll = [];
    for (var j = 0; j <= 16; j++) {
      var t = (kind === "E") ? [v, minN + j / 16 * (maxN - minN)] : [minE + j / 16 * (maxE - minE), v];
      var g = proj4(def, "EPSG:4326", t); ll.push(L.latLng(g[1], g[0]));
    }
    gridLayer.addLayer(L.polyline(ll, style));
    gridLines.push({ kind: kind, v: v, ll: ll });
  }
  for (var e = Math.ceil(minE / s) * s; e <= maxE; e += s) line("E", e);
  for (var n = Math.ceil(minN / s) * s; n <= maxN; n += s) line("N", n);
  gridLayer.spacing = s; gridLayer.zone = zone;
  placeLabels();
}

// where a polyline (container px) crosses x = c or y = c
function crossing(pts, axis, c) {
  for (var i = 1; i < pts.length; i++) {
    var a = pts[i - 1][axis] - c, b = pts[i][axis] - c;
    if (a === 0) return pts[i - 1];
    if (a * b < 0) { var t = a / (a - b);
      return L.point(pts[i - 1].x + t * (pts[i].x - pts[i - 1].x), pts[i - 1].y + t * (pts[i].y - pts[i - 1].y)); }
  }
  return null;
}

function placeLabels() {
  glabels.innerHTML = "";
  if (!gridOn) return;
  var sz = map.getSize();
  var bar = document.querySelector(".bar").getBoundingClientRect();
  var top = bar.bottom - map.getContainer().getBoundingClientRect().top + 4;
  // bottom margin sits just above whatever occupies the bottom edge:
  // the attribution/scale controls, and the coordinate panel when it is open
  var mapTop = map.getContainer().getBoundingClientRect().top, bottom = sz.y - 4;
  var occ = Array.prototype.slice.call(document.querySelectorAll(".leaflet-bottom .leaflet-control"));
  if (panel.style.display === "block") occ.push(panel);
  occ.forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.height > 0) bottom = Math.min(bottom, r.top - mapTop - 3);
  });
  var left = 4, right = sz.x - 4;
  var html = [];
  function add(cls, p, txt) {
    html.push("<div class='glab " + cls + "' style='left:" + p.x.toFixed(1) + "px;top:" + p.y.toFixed(1) + "px'>" + txt + "</div>");
  }
  gridLines.forEach(function (g) {
    var pts = g.ll.map(function (x) { return map.latLngToContainerPoint(x); });
    var txt = gridLabel(g.v);
    if (g.kind === "E") {
      var p1 = crossing(pts, "y", top);    if (p1 && p1.x > 20 && p1.x < sz.x - 20) add("t", p1, txt);
      var p2 = crossing(pts, "y", bottom); if (p2 && p2.x > 20 && p2.x < sz.x - 20) add("b", p2, txt);
    } else {
      var p3 = crossing(pts, "x", left);  if (p3 && p3.y > top + 20 && p3.y < bottom - 20) add("l", p3, txt);
      var p4 = crossing(pts, "x", right); if (p4 && p4.y > top + 20 && p4.y < bottom - 20) add("r", p4, txt);
    }
  });
  glabels.innerHTML = html.join("");
}

// keep Leaflet's top controls clear of the toolbar, however it wraps
function fitControls() {
  var bar = document.querySelector(".bar").getBoundingClientRect();
  document.querySelectorAll(".leaflet-top").forEach(function (el) { el.style.top = (bar.bottom + 2) + "px"; });
}
window.addEventListener("resize", fitControls); fitControls();

function setGrid(on) {
  gridOn = on; gridBtn.classList.toggle("on", on); buildGrid(); writeHash();
}
gridBtn.onclick = function () { setGrid(!gridOn); };
map.on("moveend", buildGrid);
map.on("move", placeLabels);
map.on("zoomstart", function () { glabels.innerHTML = ""; });
map.on("resize", buildGrid);
window.addEventListener("beforeprint", placeLabels);
window.addEventListener("afterprint", placeLabels);

// ---------------------------------------------------------------------------
// Cadastral parcels (theLIST Public/CadastreParcels, which already carries the
// property address on each parcel).
//   zoom >= 15  parcel outlines, drawn by the server (export as 512 px tiles)
//   zoom 18     house numbers, zoom 19 street address, at each parcel's centroid
//   any zoom    tapping a point looks up the parcel under the pin
// ---------------------------------------------------------------------------
var CAD = "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/CadastreParcels/MapServer";
var parcelsOn = true, parcelInfo = null, parcelSeq = 0;
var parcelsBtn = document.getElementById("parcels");

var ExportTiles = L.TileLayer.extend({
  getTileUrl: function (c) {
    var ts = this.getTileSize(), nw = c.scaleBy(ts), se = nw.add(ts);
    var a = L.CRS.EPSG3857.project(this._map.unproject(nw, c.z)),
        b = L.CRS.EPSG3857.project(this._map.unproject(se, c.z));
    return CAD + "/export?bbox=" + [a.x, b.y, b.x, a.y].map(function (v) { return v.toFixed(2); }).join(",") +
      "&bboxSR=3857&imageSR=3857&size=" + ts.x + "," + ts.y +
      "&format=png32&transparent=true&dpi=96&f=image&dynamicLayers=" + encodeURIComponent(parcelStyle());
  }
});
// outline colour per basemap: near-white on the aerial photo, dark elsewhere
function parcelStyle() {
  var col = sel.value === "ortho" ? [255, 255, 255, 230] : [40, 40, 40, 220];
  return JSON.stringify([{ id: 0, source: { type: "mapLayer", mapLayerId: 0 }, drawingInfo: { renderer: {
    type: "simple", symbol: { type: "esriSFS", style: "esriSFSNull",
      outline: { type: "esriSLS", style: "esriSLSSolid", color: col, width: sel.value === "ortho" ? 1.2 : 1 } } } } }]);
}
var parcelTiles = new ExportTiles("", { tileSize: 512, minZoom: 15, maxZoom: 19, zIndex: 5, opacity: 0.9,
  attribution: "Parcels &copy; State of Tasmania, theLIST" });
var parcelLabels = L.layerGroup(), parcelHi = L.layerGroup().addTo(map);
var labelCache = {}, labelAbort = null;

function shortNumber(a) {           // "123-123A LIVERPOOL ST" -> "123-123A"
  var m = /^\s*([0-9][0-9A-Z\/\-]*)\s/.exec(a || ""); return m ? m[1] : null;
}
function ringCentroid(r) {          // area centroid of a lon/lat ring; falls back to vertex mean
  var A = 0, x = 0, y = 0;
  for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
    var f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
    A += f; x += (r[j][0] + r[i][0]) * f; y += (r[j][1] + r[i][1]) * f;
  }
  if (Math.abs(A) < 1e-14) {
    r.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / r.length, y / r.length];
  }
  return [x / (3 * A), y / (3 * A)];
}
function ringArea(r) { var A = 0; for (var i = 0, j = r.length - 1; i < r.length; j = i++) A += r[j][0] * r[i][1] - r[i][0] * r[j][1]; return Math.abs(A); }
function labelPoint(geom) {
  var rings = geom.type === "Polygon" ? [geom.coordinates[0]] :
              geom.type === "MultiPolygon" ? geom.coordinates.map(function (p) { return p[0]; }) : [];
  if (!rings.length) return null;
  rings.sort(function (a, b) { return ringArea(b) - ringArea(a); });
  var c = ringCentroid(rings[0]); return L.latLng(c[1], c[0]);
}

function refreshParcelLabels() {
  parcelLabels.clearLayers();
  var z = map.getZoom();
  if (!overlayWanted() || z < 18) return;
  var b = map.getBounds();
  if (labelAbort) labelAbort.abort();
  labelAbort = window.AbortController ? new AbortController() : null;
  var url = CAD + "/0/query?geometry=" + [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(function (v) { return v.toFixed(6); }).join(",") +
    "&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&spatialRel=esriSpatialRelIntersects" +
    "&outFields=OBJECTID,PROP_ADD1&returnGeometry=true&maxAllowableOffset=0.00001&geometryPrecision=6&f=geojson";
  fetch(url, labelAbort ? { signal: labelAbort.signal } : {}).then(function (r) { return r.json(); }).then(function (gj) {
    parcelLabels.clearLayers();
    var z2 = map.getZoom();
    (gj.features || []).forEach(function (ft) {
      var a = ft.properties && ft.properties.PROP_ADD1; if (!a) return;
      var id = ft.properties.OBJECTID;
      var p = labelCache[id] || (labelCache[id] = labelPoint(ft.geometry)); if (!p) return;
      var txt = z2 >= 19 ? a : shortNumber(a); if (!txt) return;
      var d = document.createElement("div"); d.textContent = txt;
      parcelLabels.addLayer(L.marker(p, { interactive: false, keyboard: false,
        icon: L.divIcon({ className: "", iconSize: null, html: "<div class='plab'>" + d.innerHTML + "</div>" }) }));
    });
  }).catch(function () {});
}

function lookupParcel(ll) {
  var seq = ++parcelSeq; parcelHi.clearLayers();
  if (!parcelsOn) return;
  var url = CAD + "/0/query?geometry=" + ll.lng.toFixed(7) + "," + ll.lat.toFixed(7) +
    "&geometryType=esriGeometryPoint&inSR=4326&outSR=4326&spatialRel=esriSpatialRelIntersects" +
    "&outFields=PID,VOLUME,FOLIO,CAD_TYPE1,TENURE_TY,FEAT_NAME,PROP_NAME,PROP_ADD,COMP_AREA" +
    "&returnGeometry=true&geometryPrecision=7&f=geojson";
  fetch(url).then(function (r) { return r.json(); }).then(function (gj) {
    if (seq !== parcelSeq || !pin) return;
    var ft = (gj.features || [])[0];
    parcelInfo = ft ? ft.properties : { none: true };
    if (ft) parcelHi.addLayer(L.geoJSON(ft, { interactive: false,
      style: { color: "#e65100", weight: 3, fill: true, fillOpacity: 0.08 } }));
    showCoords(pin.getLatLng());
  }).catch(function () {
    if (seq !== parcelSeq || !pin) return;
    parcelInfo = { failed: true }; showCoords(pin.getLatLng());
  });
}

function parcelRows() {
  if (!parcelsOn || !parcelInfo) return [];
  if (parcelInfo.failed) return [{ k: "Address", v: "(parcel lookup failed)" }];
  if (parcelInfo.none) return [{ k: "Address", v: "(no parcel here)" }];
  var p = parcelInfo, rows = [];
  var name = p.PROP_NAME || p.FEAT_NAME;
  rows.push({ k: "Address", v: p.PROP_ADD || name || "(no address)" });
  if (name && p.PROP_ADD) rows.push({ k: "Name", v: name, extra: true });
  if (p.VOLUME) rows.push({ k: "Title", v: p.VOLUME + "/" + p.FOLIO, extra: true });
  if (p.PID) rows.push({ k: "PID", v: String(p.PID), extra: true });
  var t = [p.CAD_TYPE1, p.TENURE_TY].filter(function (x) { return x; }).join(", ");
  if (t) rows.push({ k: "Parcel", v: t, extra: true });
  if (p.COMP_AREA) rows.push({ k: "Area", v: p.COMP_AREA >= 10000 ? (p.COMP_AREA / 10000).toFixed(2) + " ha" :
    Math.round(p.COMP_AREA) + " m2", extra: true });
  return rows;
}

function overlayWanted() { return parcelsOn; }
function syncParcelOverlay() {
  map.getContainer().classList.toggle("on-ortho", sel.value === "ortho");
  if (map.hasLayer(parcelTiles)) parcelTiles.redraw();
  if (overlayWanted()) {
    if (!map.hasLayer(parcelTiles)) parcelTiles.addTo(map);
    if (!map.hasLayer(parcelLabels)) parcelLabels.addTo(map);
    refreshParcelLabels();
  } else { map.removeLayer(parcelTiles); map.removeLayer(parcelLabels); parcelLabels.clearLayers(); }
}
function setParcels(on) {
  parcelsOn = on; parcelsBtn.classList.toggle("on", on);
  syncParcelOverlay();
  if (on) { if (pin) lookupParcel(pin.getLatLng()); }
  else { parcelHi.clearLayers(); parcelInfo = null; if (pin) showCoords(pin.getLatLng()); }
  writeHash();
}
parcelsBtn.onclick = function () { setParcels(!parcelsOn); };
map.on("moveend", refreshParcelLabels);

// ---------------------------------------------------------------------------
// Point/polygon overlays fetched for the view as GeoJSON from theLIST.
// Tapping a symbol pins it and names it in the panel ("Feature" row).
//   Water: TasWater hydrants and network structures (dams, reservoirs, tanks,
//          pump stations, treatment plants), Tas Irrigation dams and pumps
//   Gates: gates and barriers from the Transport Node dataset
// ---------------------------------------------------------------------------
var LISTPUB = "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/";
var TW_TYPES = { 1: ["Break pressure tank", "B"], 2: ["Tank", "T"], 3: ["Treatment plant", "W"], 5: ["Treatment plant", "W"],
  6: ["Dosing facility", "X"], 8: ["Pump station", "P"], 9: ["Pump station", "P"], 10: ["Pump station", "P"],
  11: ["Reservoir", "R"], 12: ["Dam (storage)", "D"] };
var GATE_SYM = { "GATE": "G", "BOOM GATE": "B", "BOLLARD": "o", "FENCE BARRIER": "F", "IMMOVABLE BARRIER": "X",
  "REMOVABLE BARRIER": "R", "STOCK GRID": "#", "UNKNOWN BARRIER": "?" };
function titleCase(t) { return String(t || "").toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); }); }
function joinBits(a) { return a.filter(function (x) { return x && String(x).trim(); }).join(", "); }

var OVERLAYS = {
  water: { flag: "w", btn: "water", layers: [
    { url: "Infrastructure/MapServer/2", minZoom: 16, fields: "OBJECTID,ASSETID", kind: "hyd",
      describe: function (p) { return { what: "TasWater hydrant", sym: "H", detail: p.ASSETID ? "Asset " + p.ASSETID : "" }; } },
    { url: "Infrastructure/MapServer/9", minZoom: 12, fields: "OBJECTID,NAME,SUBTYPECD,D_SUBTYPEC", kind: "tw",
      describe: function (p) { var t = TW_TYPES[p.SUBTYPECD] || [p.D_SUBTYPEC || "Structure", "?"];
        return { what: "TasWater " + t[0].toLowerCase(), sym: t[1], detail: p.NAME || "" }; } },
    { url: "Infrastructure/MapServer/26", minZoom: 11, fields: "OBJECTID,NAME,SCHEME", kind: "ti",
      describe: function (p) { return { what: "Tas Irrigation pump station", sym: "P", detail: joinBits([p.NAME, p.SCHEME]) }; } },
    { url: "Infrastructure/MapServer/35", minZoom: 11, fields: "OBJECTID,DAMNAME,RESERVOIRNAME,VOLUME,SCHEME", kind: "ti", polygon: true,
      describe: function (p) { return { what: "Tas Irrigation dam", sym: "D",
        detail: joinBits([p.DAMNAME || p.RESERVOIRNAME, p.VOLUME ? p.VOLUME + " ML" : null, p.SCHEME]) }; } }
  ] },
  gates: { flag: "b", btn: "gates", layers: [
    { url: "TopographyAndRelief/MapServer/59", minZoom: 13, kind: "gate",
      fields: "OBJECTID,BARRIER_TY,STATUS,AUTHORITY,PRI_NAME,SEC_NAME",
      describe: function (p) { var t = String(p.BARRIER_TY || "Unknown Barrier").toUpperCase();
        return { what: titleCase(t), sym: GATE_SYM[t] || "?",
          detail: joinBits([p.PRI_NAME, p.SEC_NAME, p.STATUS && p.STATUS !== "Unknown" ? p.STATUS : null, p.AUTHORITY]) }; } }
  ] }
};

var featureInfo = null;
function featureRows() {
  if (!featureInfo) return [];
  return [{ k: "Feature", v: featureInfo.what + (featureInfo.detail ? " - " + featureInfo.detail : "") }];
}
function pickFeature(ll, info) {
  lastFeatureClick = Date.now();
  setPin(ll); featureInfo = info; showCoords(ll);
}
function symIcon(kind, sym) {
  var sz = kind === "hyd" ? 16 : 18;
  return L.divIcon({ className: "", iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
    html: "<div class='wsym " + kind + "' style='width:" + sz + "px;height:" + sz + "px'><span>" + sym + "</span></div>" });
}

Object.keys(OVERLAYS).forEach(function (name) {
  var o = OVERLAYS[name];
  o.on = false; o.group = L.layerGroup(); o.button = document.getElementById(o.btn);
  o.layers.forEach(function (w) { w.seen = {}; w.group = L.layerGroup().addTo(o.group); });
  o.button.onclick = function () { setOverlay(name, !o.on); };
});

function refreshOverlay(o) {
  if (!o.on) return;
  var z = map.getZoom(), b = map.getBounds().pad(0.2);
  var env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(function (v) { return v.toFixed(6); }).join(",");
  o.layers.forEach(function (w) {
    if (z < w.minZoom) { w.group.clearLayers(); w.seen = {}; return; }
    var url = LISTPUB + w.url + "/query?geometry=" + env + "&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326" +
      "&spatialRel=esriSpatialRelIntersects&outFields=" + w.fields + "&returnGeometry=true" +
      (w.polygon ? "&maxAllowableOffset=0.00002" : "") + "&geometryPrecision=6&f=geojson";
    fetch(url).then(function (r) { return r.json(); }).then(function (gj) {
      if (!o.on || map.getZoom() < w.minZoom) return;
      (gj.features || []).forEach(function (ft) {
        var p = ft.properties || {}, key = p.OBJECTID != null ? p.OBJECTID : JSON.stringify(ft.geometry).slice(0, 80);
        if (w.seen[key] || !ft.geometry) return;
        w.seen[key] = true;
        var info = w.describe(p), lyr;
        if (w.polygon) {
          lyr = L.geoJSON(ft, { style: { color: "#00796b", weight: 2, fillColor: "#4db6ac", fillOpacity: 0.25 } });
          var c = labelPoint(ft.geometry);
          lyr.on("click", function (e) { pickFeature(c || e.latlng, info); });
        } else {
          var g = ft.geometry.type === "MultiPoint" ? ft.geometry.coordinates[0] : ft.geometry.coordinates;
          var ll = L.latLng(g[1], g[0]);
          lyr = L.marker(ll, { icon: symIcon(w.kind, info.sym), title: info.what + (info.detail ? " - " + info.detail : ""),
                               zIndexOffset: w.kind === "hyd" ? 0 : 100 });
          lyr.on("click", function () { pickFeature(ll, info); });
        }
        w.group.addLayer(lyr);
      });
    }).catch(function () {});
  });
}
function setOverlay(name, on) {
  var o = OVERLAYS[name];
  o.on = on; o.button.classList.toggle("on", on);
  if (on) { o.group.addTo(map); refreshOverlay(o); }
  else { map.removeLayer(o.group); o.layers.forEach(function (w) { w.group.clearLayers(); w.seen = {}; }); }
  writeHash();
}
map.on("moveend", function () { Object.keys(OVERLAYS).forEach(function (n) { refreshOverlay(OVERLAYS[n]); }); });

// ---------------------------------------------------------------------------
// Street atlas and map book references (theLIST SearchService).
//   Street atlas: pages layer 5, grid layer 6, MAPREF "SA188B6" or "SA226EB6"
//                 (page, optional page suffix E/W/T, square); shown "SA-188-B6"
//   Map book:     pages layer 1, grid layer 2, MAPREF "MB356C4"; shown "MB356 C4"
// ---------------------------------------------------------------------------
var SEARCH = LISTPUB + "SearchService/MapServer/";
var BOOKS = {
  SA: { name: "Street atlas", page: 5, grid: 6 },
  MB: { name: "Map book", page: 1, grid: 2 }
};
var refInfo = { SA: null, MB: null }, refSeq = 0, mbOutline = L.layerGroup().addTo(map);
function fmtMapref(r) {
  var m = /^SA(\d+)([EWT]?)([A-Z])(\d+)$/.exec(r || "");
  if (m) return "SA-" + m[1] + m[2] + "-" + m[3] + m[4];
  m = /^SA(\d+[A-Z]?)$/.exec(r || ""); if (m) return "SA-" + m[1];
  m = /^MB(\d+)([A-Z]+)(\d+)$/.exec(r || ""); if (m) return "MB" + m[1] + " " + m[2] + m[3];
  return r;
}
function lookupMapbook(ll) {
  var seq = ++refSeq;
  refInfo = { SA: null, MB: null };
  Object.keys(BOOKS).forEach(function (k) {
    var url = SEARCH + BOOKS[k].grid + "/query?geometry=" + ll.lng.toFixed(7) + "," + ll.lat.toFixed(7) +
      "&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=MAPREF&returnGeometry=false&f=json";
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (seq !== refSeq || !pin) return;
      var f = (j.features || [])[0];
      refInfo[k] = f ? fmtMapref(f.attributes.MAPREF) : "(outside " + BOOKS[k].name.toLowerCase() + ")";
      showCoords(pin.getLatLng());
    }).catch(function () { if (seq === refSeq && pin) { refInfo[k] = "(lookup failed)"; showCoords(pin.getLatLng()); } });
  });
}
function mapbookRows() {
  var rows = [];
  if (refInfo.SA) rows.push({ k: "Street atlas", v: refInfo.SA });
  if (refInfo.MB) rows.push({ k: "Map book", v: refInfo.MB });
  return rows;
}

// Street atlas: "SA-188-B6", "SA188B6", "sa 188 b6", "SA 226E B6"; "SA188" = page
// Map book:     "MB356 C4", "356C4", "356 c4", "mb 356 c 4";          "MB356" = page
function parseMapbook(q) {
  var t = String(q).split(/\r?\n/)[0].replace(/^\s*(map\s*book|street\s*atlas)\s*:/i, "").trim().toUpperCase();
  var m = /^SA[\s\-]*(\d{1,3})[\s\-]*([EWT]?)[\s\-]*([A-Z])[\s\-]*(\d{1,2})$/.exec(t);
  if (m) {
    var refs = ["SA" + m[1] + m[2] + m[3] + m[4]];
    refs.push("SA" + pad(m[1], 3) + m[2] + m[3] + m[4]);           // zero-padded page, just in case
    return { book: "SA", layer: BOOKS.SA.grid, refs: refs, page: false };
  }
  m = /^SA[\s\-]*(\d{1,3})[\s\-]*([EWT]?)$/.exec(t);
  if (m) return { book: "SA", layer: BOOKS.SA.page, refs: ["SA" + m[1] + m[2], "SA" + pad(m[1], 3) + m[2]], page: true };
  m = /^MB[\s\-]*(\d{1,3})[\s\-]*([A-Z])[\s\-]*(\d{1,2})$/.exec(t) || /^(\d{1,3})\s*([A-Z])\s*(\d{1,2})$/.exec(t);
  if (m) return { book: "MB", layer: BOOKS.MB.grid, refs: ["MB" + m[1] + m[2] + m[3], "MB" + pad(m[1], 3) + m[2] + m[3]], page: false };
  m = /^MB[\s\-]*(\d{1,3})$/.exec(t);
  if (m) return { book: "MB", layer: BOOKS.MB.page, refs: ["MB" + m[1], "MB" + pad(m[1], 3)], page: true };
  return null;
}
function findMapbook(mb) {
  var where = "MAPREF IN (" + mb.refs.map(function (r) { return "'" + r + "'"; }).join(",") + ")";
  var url = SEARCH + mb.layer + "/query?where=" + encodeURIComponent(where) +
    "&outFields=MAPREF&returnGeometry=true&outSR=4326&f=geojson";
  return fetch(url).then(function (r) { return r.json(); }).then(function (gj) { return (gj.features || [])[0] || null; });
}

// ---------------------------------------------------------------------------
// Toolbar: secondary buttons fold away behind "More" on narrow screens
// ---------------------------------------------------------------------------
var barEl = document.querySelector(".bar"), moreBtn = document.getElementById("moretools");
function setToolsOpen(open) {
  barEl.classList.toggle("collapsed", !open);
  moreBtn.textContent = open ? "Less" : "More";
  try { localStorage.setItem("lunamap.tools", open ? "1" : "0"); } catch (e) {}
  fitControls(); placeLabels();
}
moreBtn.onclick = function () { setToolsOpen(barEl.classList.contains("collapsed")); };
(function () {
  var saved = null; try { saved = localStorage.getItem("lunamap.tools"); } catch (e) {}
  setToolsOpen(saved !== null ? saved === "1" : window.innerWidth >= 700);
})();

// ---------------------------------------------------------------------------
// Offline: service worker (sw.js) serves cached tiles; this saves an area.
// ---------------------------------------------------------------------------
var TILE_CACHE = "lunamap-tiles-v1";
var swOK = "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost");
if (swOK) navigator.serviceWorker.register("sw.js").catch(function () { swOK = false; });
window.addEventListener("offline", function () { toast("No signal - showing saved maps"); });
window.addEventListener("online", function () { toast("Back online"); });

var offSheet = document.getElementById("offsheet"), offBases = document.getElementById("offbases");
var AVG_KB = { ortho: 35, esmb: 30, tasmap: 30, hill: 20, topo: 18, grey: 15 };
var offSaving = false;
BASEMAPS.forEach(function (b) {
  var l = document.createElement("label");
  l.innerHTML = "<input type='checkbox' value='" + b.id + "'> ";
  l.appendChild(document.createTextNode(b.name));
  offBases.appendChild(l);
});
function offChosen() {
  return Array.prototype.slice.call(offBases.querySelectorAll("input:checked")).map(function (i) { return i.value; });
}
function offTiles() {
  var zmax = +document.getElementById("offz").value, bnd = map.getBounds().pad(0.25), urls = [], kb = 0;
  offChosen().forEach(function (id) {
    var b = BASEMAPS.filter(function (x) { return x.id === id; })[0];
    for (var z = 8; z <= Math.min(zmax, b.max); z++) {
      var nw = map.project(bnd.getNorthWest(), z).divideBy(256).floor(),
          se = map.project(bnd.getSouthEast(), z).divideBy(256).floor();
      for (var x = nw.x; x <= se.x; x++) for (var y = nw.y; y <= se.y; y++) {
        urls.push(LIST + b.svc + "/MapServer/tile/" + z + "/" + y + "/" + x); kb += AVG_KB[id] || 25;
      }
    }
  });
  return { urls: urls, mb: kb / 1024 };
}
function offEstimate() {
  var t = offTiles(), el = document.getElementById("offest"), btn = document.getElementById("offsave");
  if (!swOK) { el.textContent = "Offline maps need the site opened over https (for example on github.io)."; btn.disabled = true; return; }
  if (!t.urls.length) { el.textContent = "Tick at least one basemap."; btn.disabled = true; return; }
  var big = t.urls.length > 20000;
  el.textContent = t.urls.length + " tiles, about " + t.mb.toFixed(t.mb < 10 ? 1 : 0) + " MB" +
    (big ? " - too many: zoom in or choose less detail" : "");
  btn.disabled = big || offSaving;
}
function offStatus() {
  var el = document.getElementById("offstat");
  if (!window.caches) { el.textContent = ""; return; }
  caches.open(TILE_CACHE).then(function (c) { return c.keys(); }).then(function (k) {
    var txt = "Saved on this device: " + k.length + " tiles";
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (e) {
        el.textContent = txt + " (" + (e.usage / 1048576).toFixed(0) + " MB used by this site)";
      });
    } else el.textContent = txt;
  }).catch(function () {});
}
function offSave() {
  var t = offTiles(), done = 0, failed = 0, i = 0, prog = document.getElementById("offprog");
  if (!t.urls.length || !window.caches) return;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  offSaving = true; offEstimate();
  caches.open(TILE_CACHE).then(function (c) {
    function one() {
      if (!offSaving || i >= t.urls.length) return Promise.resolve();
      var u = t.urls[i++];
      return c.match(u).then(function (hit) {
        if (hit) return;
        return fetch(u, { mode: "cors", credentials: "omit" }).then(function (r) {
          if (!r.ok) throw new Error(r.status); return c.put(u, r);
        });
      }).catch(function () { failed++; }).then(function () {
        done++;
        if (done % 10 === 0 || done === t.urls.length)
          prog.textContent = "Saving " + done + " / " + t.urls.length + (failed ? " (" + failed + " failed)" : "");
        return one();
      });
    }
    var workers = []; for (var k = 0; k < 6; k++) workers.push(one());
    return Promise.all(workers);
  }).then(function () {
    var stopped = !offSaving; offSaving = false;
    prog.textContent = (stopped ? "Stopped after " : "Saved ") + done + " tiles" + (failed ? ", " + failed + " failed" : "");
    offEstimate(); offStatus();
  });
}
document.getElementById("offline").onclick = function () {
  var cur = offBases.querySelector("input[value='" + (sel.value || "topo") + "']");
  if (cur && !offChosen().length) cur.checked = true;
  offSheet.style.display = "block"; offEstimate(); offStatus();
};
document.getElementById("offclose").onclick = function () { offSaving = false; offSheet.style.display = "none"; };
document.getElementById("offsave").onclick = offSave;
document.getElementById("offclear").onclick = function () {
  if (!window.caches || !confirm("Remove all saved map tiles from this device?")) return;
  offSaving = false;
  caches.delete(TILE_CACHE).then(function () { document.getElementById("offprog").textContent = "Cleared"; offStatus(); });
};
offBases.addEventListener("change", offEstimate);
document.getElementById("offz").addEventListener("change", offEstimate);
map.on("moveend", function () { if (offSheet.style.display === "block") offEstimate(); });

// ---------------------------------------------------------------------------
setOverlay("water", !!st.water);
setOverlay("gates", !!st.gates);
setParcels(!st.noParcels);
setGrid(!!st.grid);
setLayer(st.layer || "topo");
if (st.pin) setPin(L.latLng(st.pin[0], st.pin[1]));
</script>
</body>
</html>
